<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocab & Structures Builder</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        /* Add padding to body to account for fixed top nav */
        body {
            padding-top: 5rem;
        }

        .card {
            background-color: white;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            position: relative;
            transition: all 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        /* Floating Action Button */
        .fab {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 4rem;
            height: 4rem;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3);
            cursor: pointer;
            transition: background-color 0.3s;
            z-index: 40;
        }

        /* Accordion transition for structures */
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
            opacity: 0;
        }

        .accordion-content.expanded {
            max-height: 1000px;
            /* Arbitrary large number */
            opacity: 1;
            margin-top: 1rem;
        }

        /* Custom scrollbar for modals */
        .modal-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .modal-scroll::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .modal-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        /* Badges for Word Anatomy */
        .badge-prefix {
            background-color: #DBEAFE;
            color: #1E40AF;
            border: 1px solid #BFDBFE;
        }

        /* Blue */
        .badge-root {
            background-color: #F3E8FF;
            color: #6B21A8;
            border: 1px solid #E9D5FF;
        }

        /* Purple */
        .badge-suffix {
            background-color: #DCFCE7;
            color: #166534;
            border: 1px solid #BBF7D0;
        }

        /* Green */
    </style>
</head>

<body>

    <!-- TOP NAVIGATION BAR -->
    <nav class="fixed top-0 left-0 w-full bg-white shadow-md z-50">
        <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-center space-x-8 h-16">
                <button onclick="switchTab('vocab')" id="nav-vocab"
                    class="tab-btn inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium border-blue-500 text-blue-600">
                    <i class="fas fa-book-open mr-2"></i> Vocabulary
                </button>
                <button onclick="switchTab('structures')" id="nav-structures"
                    class="tab-btn inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300">
                    <i class="fas fa-layer-group mr-2"></i> Sentence Structures
                </button>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <main class="max-w-3xl mx-auto p-4 pb-24">

        <!-- ==================== VIEW: VOCABULARY ==================== -->
        <div id="view-vocab" class="view-section block">
            <div class="mb-6 relative">
                <input type="text" id="searchVocab" placeholder="Search vocabulary..."
                    class="w-full px-4 py-3 pl-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 transition shadow-sm">
                <i class="fas fa-search absolute left-3 top-4 text-gray-400"></i>
                <button onclick="document.getElementById('configModal').classList.remove('hidden')"
                    class="absolute right-3 top-3.5 text-gray-400 hover:text-blue-600 transition" title="Settings">
                    <i class="fas fa-cog text-lg"></i>
                </button>
            </div>
            <div id="vocabList">
                <div class="text-center py-10 text-gray-500"><i class="fas fa-spinner fa-spin text-3xl mb-3"></i>
                    <p>Loading words...</p>
                </div>
            </div>
            <div id="addVocabBtn" class="fab bg-blue-600 hover:bg-blue-700 text-white" onclick="openWordModal()">
                <i class="fas fa-plus fa-lg"></i>
            </div>
        </div>

        <!-- ==================== VIEW: STRUCTURES ==================== -->
        <div id="view-structures" class="view-section hidden">
            <div class="mb-6 relative">
                <input type="text" id="searchStructures" placeholder="Search purposes, keywords or structures..."
                    class="w-full px-4 py-3 pl-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 transition shadow-sm">
                <i class="fas fa-search absolute left-3 top-4 text-gray-400"></i>
            </div>
            <div id="structuresList">
                <!-- Structures generated here -->
            </div>
            <div id="addStructureBtn" class="fab bg-green-600 hover:bg-green-700 text-white"
                onclick="openStructureModal()">
                <i class="fas fa-plus fa-lg"></i>
            </div>
        </div>
    </main>

    <!-- ==================== MODALS ==================== -->

    <!-- Modal: App Configuration -->
    <div id="configModal"
        class="fixed inset-0 bg-gray-900 bg-opacity-70 flex items-center justify-center z-[60] p-4 hidden">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-md">
            <h2 class="text-2xl font-bold mb-2"><i class="fas fa-cogs text-blue-500 mr-2"></i> App Settings</h2>
            <p class="text-gray-600 mb-4 text-sm">Enter your Database and AI credentials.</p>
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-1 text-sm">Supabase Project URL</label>
                <input type="text" id="supaUrl" class="w-full px-3 py-2 border rounded-md"
                    placeholder="https://xyz.supabase.co">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-1 text-sm">Supabase Anon Key</label>
                <input type="password" id="supaKey" class="w-full px-3 py-2 border rounded-md" placeholder="eyJh...">
            </div>
            <div class="mb-6 border-t pt-4">
                <label class="block text-gray-700 font-semibold mb-1 text-sm">Gemini API Key (For Smart Fetch)</label>
                <input type="password" id="geminiKey" class="w-full px-3 py-2 border rounded-md"
                    placeholder="AIzaSy...">
                <p class="text-xs text-gray-500 mt-1">Required to fetch word structure, synonyms, etc.</p>
            </div>
            <div class="flex gap-2">
                <button onclick="document.getElementById('configModal').classList.add('hidden')"
                    class="w-1/3 bg-gray-200 text-gray-800 py-2 rounded-lg font-semibold hover:bg-gray-300 transition">Cancel</button>
                <button onclick="saveConfig()"
                    class="w-2/3 bg-gray-900 text-white py-2 rounded-lg font-bold hover:bg-black transition">Save &
                    Connect</button>
            </div>
        </div>
    </div>

    <!-- Modal: Word Form -->
    <div id="wordModal"
        class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-lg flex flex-col max-h-[90vh]">
            <div class="p-5 border-b flex justify-between items-center bg-gray-50 rounded-t-xl">
                <h2 id="wordModalTitle" class="text-xl font-bold text-gray-800">Add Word</h2>
                <button onclick="closeModals()" class="text-gray-400 hover:text-gray-600"><i
                        class="fas fa-times fa-lg"></i></button>
            </div>
            <div class="p-5 overflow-y-auto modal-scroll flex-1">
                <form id="wordForm">
                    <input type="hidden" id="wordId">
                    <input type="hidden" id="audioUrl">

                    <div class="mb-4">
                        <label class="block text-gray-700 font-medium mb-1 text-sm">Word <span
                                class="text-red-500">*</span></label>
                        <div class="flex gap-2">
                            <input type="text" id="wordInput" class="flex-1 px-3 py-2 border rounded-md" required>
                            <button type="button" onclick="fetchWordAPI()"
                                class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 font-semibold transition text-sm flex items-center shadow-sm">
                                <i class="fas fa-magic mr-2"></i> AI Fetch
                            </button>
                        </div>
                        <p id="fetchStatus" class="text-xs text-gray-500 mt-1 h-4"></p>
                    </div>

                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-gray-700 font-medium mb-1 text-sm">Phonetics</label>
                            <input type="text" id="phonetics" class="w-full px-3 py-2 border rounded-md text-sm">
                        </div>
                        <div>
                            <label class="block text-gray-700 font-medium mb-1 text-sm">Part of Speech</label>
                            <input type="text" id="partOfSpeech" class="w-full px-3 py-2 border rounded-md text-sm">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="block text-gray-700 font-medium mb-1 text-sm">English Meaning <span
                                class="text-red-500">*</span></label>
                        <textarea id="englishMeaning" rows="2" class="w-full px-3 py-2 border rounded-md text-sm"
                            required></textarea>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 font-medium mb-1 text-sm">Vietnamese Meaning</label>
                        <textarea id="vietnameseMeaning" rows="2"
                            class="w-full px-3 py-2 border rounded-md text-sm"></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-gray-700 font-medium mb-1 text-sm">Synonyms</label>
                            <input type="text" id="synonyms" class="w-full px-3 py-2 border rounded-md text-sm">
                        </div>
                        <div>
                            <label class="block text-gray-700 font-medium mb-1 text-sm">Antonyms</label>
                            <input type="text" id="antonyms" class="w-full px-3 py-2 border rounded-md text-sm">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="block text-gray-700 font-medium mb-1 text-sm">Collocations</label>
                        <input type="text" id="collocations" class="w-full px-3 py-2 border rounded-md text-sm">
                    </div>

                    <!-- NEW FIELDS: Morphemes & Word Family -->
                    <div class="mb-4 p-3 bg-blue-50 rounded-lg border border-blue-100">
                        <label class="block text-blue-900 font-medium mb-2 text-sm"><i
                                class="fas fa-puzzle-piece mr-1"></i> Word Structure (Morphemes)</label>
                        <div class="grid grid-cols-3 gap-2">
                            <input type="text" id="prefix"
                                class="w-full px-3 py-2 border border-blue-200 rounded-md text-sm focus:ring-blue-500 focus:border-blue-500"
                                placeholder="Prefix (e.g. un)">
                            <input type="text" id="rootWord"
                                class="w-full px-3 py-2 border border-blue-200 rounded-md text-sm focus:ring-blue-500 focus:border-blue-500"
                                placeholder="Root (e.g. dict)">
                            <input type="text" id="suffix"
                                class="w-full px-3 py-2 border border-blue-200 rounded-md text-sm focus:ring-blue-500 focus:border-blue-500"
                                placeholder="Suffix (e.g. able)">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="block text-gray-700 font-medium mb-1 text-sm">Word Family</label>
                        <input type="text" id="wordFamily" class="w-full px-3 py-2 border rounded-md text-sm"
                            placeholder="e.g. prediction (n), predictive (adj)">
                    </div>

                    <div class="mb-2">
                        <label class="block text-gray-700 font-medium mb-1 text-sm">Example Sentence</label>
                        <textarea id="exampleSentence" rows="2"
                            class="w-full px-3 py-2 border rounded-md text-sm"></textarea>
                    </div>
                </form>
            </div>
            <div class="p-4 border-t bg-gray-50 rounded-b-xl flex justify-end gap-2">
                <button onclick="closeModals()"
                    class="px-4 py-2 rounded-md border text-gray-600 hover:bg-gray-100 text-sm font-medium">Cancel</button>
                <button onclick="saveWord()"
                    class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 font-medium text-sm shadow-sm">Save
                    Word</button>
            </div>
        </div>
    </div>

    <!-- Modal: Structure Form -->
    <div id="structureModal"
        class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-lg flex flex-col max-h-[90vh]">
            <div class="p-5 border-b flex justify-between items-center bg-gray-50 rounded-t-xl">
                <h2 id="structureModalTitle" class="text-xl font-bold text-gray-800">Add Structure</h2>
                <button onclick="closeModals()" class="text-gray-400 hover:text-gray-600"><i
                        class="fas fa-times fa-lg"></i></button>
            </div>
            <div class="p-5 overflow-y-auto modal-scroll flex-1">
                <form id="structureForm">
                    <input type="hidden" id="structureId">

                    <div class="mb-4">
                        <label class="block text-gray-700 font-medium mb-1 text-sm">Purpose <span
                                class="text-red-500">*</span></label>
                        <input type="text" id="structPurpose" class="w-full px-3 py-2 border rounded-md"
                            placeholder="e.g., Provide support or assistance" required>
                    </div>

                    <div class="mb-4">
                        <label class="block text-gray-700 font-medium mb-1 text-sm">Keywords (Comma separated) <span
                                class="text-red-500">*</span></label>
                        <input type="text" id="structKeywords" class="w-full px-3 py-2 border rounded-md"
                            placeholder="e.g., help, give a hand" required>
                    </div>

                    <div class="mb-4">
                        <label class="block text-gray-700 font-medium mb-1 text-sm">Structures (Comma separated) <span
                                class="text-red-500">*</span></label>
                        <input type="text" id="structPatterns" class="w-full px-3 py-2 border rounded-md"
                            placeholder="e.g., get sb interested, help you + verb" required>
                    </div>

                    <div class="mb-2">
                        <label class="block text-gray-700 font-medium mb-1 text-sm">Example Sentences (One per line)
                            <span class="text-red-500">*</span></label>
                        <textarea id="structExamples" rows="4" class="w-full px-3 py-2 border rounded-md text-sm"
                            placeholder="We help you structure and refine your business plan..." required></textarea>
                    </div>
                </form>
            </div>
            <div class="p-4 border-t bg-gray-50 rounded-b-xl flex justify-end gap-2">
                <button onclick="closeModals()"
                    class="px-4 py-2 rounded-md border text-gray-600 hover:bg-gray-100 text-sm">Cancel</button>
                <button onclick="saveStructure()"
                    class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 font-medium text-sm">Save
                    Structure</button>
            </div>
        </div>
    </div>

    <!-- MAIN JAVASCRIPT LOGIC -->
    <script>
        // --- State Variables ---
        let supabaseClient = null;
        let words = [];
        let structures = [];
        let geminiApiKey = null;

        // --- Initialization & Supabase Setup ---
        document.addEventListener('DOMContentLoaded', () => {
            checkConfig();

            // Search listeners
            document.getElementById('searchVocab').addEventListener('input', (e) => renderWords(e.target.value));
            document.getElementById('searchStructures').addEventListener('input', (e) => renderStructures(e.target.value));
        });

        function checkConfig() {
            const storedUrl = localStorage.getItem('supabase_url');
            const storedKey = localStorage.getItem('supabase_key');
            geminiApiKey = localStorage.getItem('gemini_key');

            if (!storedUrl || !storedKey) {
                document.getElementById('configModal').classList.remove('hidden');
            } else {
                // Populate inputs in case user wants to edit later
                document.getElementById('supaUrl').value = storedUrl;
                document.getElementById('supaKey').value = storedKey;
                document.getElementById('geminiKey').value = geminiApiKey || '';
                initSupabase(storedUrl, storedKey);
            }
        }

        function saveConfig() {
            const url = document.getElementById('supaUrl').value.trim();
            const key = document.getElementById('supaKey').value.trim();
            const gKey = document.getElementById('geminiKey').value.trim();

            if (url && key) {
                localStorage.setItem('supabase_url', url);
                localStorage.setItem('supabase_key', key);

                if (gKey) {
                    localStorage.setItem('gemini_key', gKey);
                    geminiApiKey = gKey;
                }

                document.getElementById('configModal').classList.add('hidden');
                initSupabase(url, key);
            } else {
                alert('Please enter both Supabase URL and Key.');
            }
        }

        function initSupabase(url, key) {
            supabaseClient = supabase.createClient(url, key);
            fetchData();
        }

        async function fetchData() {
            try {
                // Fetch words
                const { data: wordsData, error: wError } = await supabaseClient.from('vocab_words').select('*').order('created_at', { ascending: false });
                if (wError) throw wError;
                words = wordsData || [];

                // Fetch structures
                const { data: structData, error: sError } = await supabaseClient.from('sentence_structures').select('*').order('created_at', { ascending: false });
                if (sError) throw sError;
                structures = structData || [];

                renderWords();
                renderStructures();
            } catch (error) {
                console.error('Error fetching data:', error);
                alert("Database Connection Error. Check your credentials and RLS policies.");
                document.getElementById('vocabList').innerHTML = '<p class="text-center text-red-500">Failed to load data.</p>';
            }
        }

        // --- Tab Navigation ---
        function switchTab(tab) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('border-blue-500', 'text-blue-600');
                el.classList.add('border-transparent', 'text-gray-500');
            });

            document.getElementById(`view-${tab}`).classList.remove('hidden');

            const activeTab = document.getElementById(`nav-${tab}`);
            activeTab.classList.remove('border-transparent', 'text-gray-500');
            activeTab.classList.add('border-blue-500', 'text-blue-600');
        }

        // --- Helper: Play Audio ---
        window.playAudio = (url, textFallback) => {
            if (url && url !== "undefined" && url.trim() !== "") {
                const audio = new Audio(url);
                audio.play().catch(() => speakFallback(textFallback));
            } else {
                speakFallback(textFallback);
            }
        };

        function speakFallback(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }

        // --- VOCABULARY LOGIC ---
        function renderWords(searchTerm = '') {
            const listEl = document.getElementById('vocabList');
            listEl.innerHTML = '';

            const term = searchTerm.toLowerCase();
            const filtered = words.filter(w =>
                w.word.toLowerCase().includes(term) ||
                (w.vietnamese_meaning && w.vietnamese_meaning.toLowerCase().includes(term)) ||
                (w.english_meaning && w.english_meaning.toLowerCase().includes(term))
            );

            if (filtered.length === 0) {
                listEl.innerHTML = `<p class="text-center text-gray-500 py-6">No words found.</p>`;
                return;
            }

            filtered.forEach(item => {
                // Find linked structures
                const linkedStructures = structures.filter(s =>
                    s.keywords && s.keywords.some(kw => kw.toLowerCase() === item.word.toLowerCase())
                );

                let linksHtml = '';
                if (linkedStructures.length > 0) {
                    linksHtml = `<div class="mt-4 pt-3 border-t border-gray-100">
                        <p class="text-xs text-gray-500 mb-2 uppercase font-semibold tracking-wider">Related Structures</p>
                        <div class="flex flex-wrap gap-2">
                            ${linkedStructures.map(s => `
                                <button onclick="jumpToStructure('${s.id}')" class="text-xs bg-green-50 text-green-700 px-2 py-1 rounded border border-green-200 hover:bg-green-100 transition flex items-center">
                                    <i class="fas fa-link mr-1"></i> ${s.purpose}
                                </button>
                            `).join('')}
                        </div>
                    </div>`;
                }

                // Building Word Anatomy HTML
                let anatomyHtml = '';
                if (item.prefix || item.root || item.suffix) {
                    anatomyHtml = `
                    <div class="mb-4">
                        <h4 class="text-xs uppercase text-gray-500 font-bold mb-2 flex items-center"><i class="fas fa-puzzle-piece mr-1"></i> Word Anatomy</h4>
                        <div class="flex flex-wrap items-center gap-1 sm:gap-2">
                            ${item.prefix ? `<div class="badge-prefix px-2 py-1 rounded text-sm"><span class="font-bold">${item.prefix}</span></div>` : ''}
                            ${item.prefix && (item.root || item.suffix) ? `<span class="text-gray-400 font-bold">+</span>` : ''}
                            ${item.root ? `<div class="badge-root px-2 py-1 rounded text-sm"><span class="font-bold">${item.root}</span></div>` : ''}
                            ${item.root && item.suffix ? `<span class="text-gray-400 font-bold">+</span>` : ''}
                            ${item.suffix ? `<div class="badge-suffix px-2 py-1 rounded text-sm"><span class="font-bold">${item.suffix}</span></div>` : ''}
                        </div>
                    </div>`;
                }

                const card = document.createElement('div');
                card.className = 'card group';
                card.innerHTML = `
                    <div class="absolute top-4 right-4 flex gap-3 opacity-0 group-hover:opacity-100 transition-opacity bg-white p-1 rounded-md shadow-sm">
                        <i class="fas fa-pen text-blue-500 hover:text-blue-700 cursor-pointer p-1" onclick="openWordModal('${item.id}')" title="Edit"></i>
                        <i class="fas fa-trash text-red-500 hover:text-red-700 cursor-pointer p-1" onclick="deleteWord('${item.id}')" title="Delete"></i>
                    </div>

                    <div class="flex items-center mb-1">
                        <h2 class="text-xl font-bold text-gray-900 mr-3">${item.word}</h2>
                        <button onclick="playAudio('${item.audio_url}', '${item.word}')" class="text-gray-500 hover:text-blue-600 focus:outline-none">
                            <i class="fas fa-volume-up"></i>
                        </button>
                    </div>

                    <div class="flex flex-wrap items-baseline gap-2 mb-3">
                        <span class="text-sm text-gray-600 font-serif italic">${item.phonetic || ''}</span>
                        ${item.part_of_speech ? `<span class="text-xs font-semibold bg-gray-100 text-gray-600 px-2 py-0.5 rounded">${item.part_of_speech}</span>` : ''}
                    </div>

                    <div class="mb-3 space-y-1 text-sm border-b border-gray-100 pb-3">
                        <p class="text-gray-800"><span class="font-bold text-blue-800">EN:</span> ${item.english_meaning}</p>
                        ${item.vietnamese_meaning ? `<p class="text-gray-800"><span class="font-bold text-red-800">VN:</span> ${item.vietnamese_meaning}</p>` : ''}
                        
                        ${item.example ? `
                        <div class="text-gray-700 italic border-l-2 border-blue-300 pl-3 text-sm bg-blue-50 py-1 pr-2 rounded-r mt-2">
                            "${item.example}"
                            <button onclick="playAudio(null, '${item.example.replace(/'/g, "\\'")}')" class="ml-1 text-gray-400 hover:text-gray-600">
                                <i class="fas fa-volume-up text-xs"></i>
                            </button>
                        </div>` : ''}
                    </div>
                    
                    ${anatomyHtml}

                    <div class="mb-3 text-xs space-y-1 ${(!item.synonyms && !item.antonyms && !item.collocations) ? 'hidden' : ''}">
                        ${item.synonyms ? `<p class="text-gray-600"><span class="font-semibold text-green-600">Syn:</span> ${item.synonyms}</p>` : ''}
                        ${item.antonyms ? `<p class="text-gray-600"><span class="font-semibold text-red-500">Ant:</span> ${item.antonyms}</p>` : ''}
                        ${item.collocations ? `<p class="text-gray-600"><span class="font-semibold text-purple-600">Col:</span> ${item.collocations}</p>` : ''}
                    </div>

                    ${item.word_family ? `
                    <div class="bg-gray-50 p-3 rounded-lg mt-3">
                        <h4 class="text-xs uppercase text-gray-500 font-bold mb-1 flex items-center"><i class="fas fa-sitemap mr-1"></i> Word Family</h4>
                        <div class="text-sm text-gray-700">${item.word_family}</div>
                    </div>` : ''}
                    
                    ${linksHtml}
                `;
                listEl.appendChild(card);
            });
        }

        function openWordModal(id = null) {
            const form = document.getElementById('wordForm');
            form.reset();
            document.getElementById('wordId').value = '';
            document.getElementById('fetchStatus').innerHTML = '';
            document.getElementById('wordModalTitle').innerText = id ? 'Edit Word' : 'Add Word';

            if (id) {
                const w = words.find(x => x.id === id);
                if (w) {
                    document.getElementById('wordId').value = w.id;
                    document.getElementById('wordInput').value = w.word;
                    document.getElementById('phonetics').value = w.phonetic || '';
                    document.getElementById('partOfSpeech').value = w.part_of_speech || '';
                    document.getElementById('englishMeaning').value = w.english_meaning || '';
                    document.getElementById('vietnameseMeaning').value = w.vietnamese_meaning || '';
                    document.getElementById('synonyms').value = w.synonyms || '';
                    document.getElementById('antonyms').value = w.antonyms || '';
                    document.getElementById('collocations').value = w.collocations || '';
                    document.getElementById('exampleSentence').value = w.example || '';
                    document.getElementById('audioUrl').value = w.audio_url || '';

                    document.getElementById('prefix').value = w.prefix || '';
                    document.getElementById('rootWord').value = w.root || '';
                    document.getElementById('suffix').value = w.suffix || '';
                    document.getElementById('wordFamily').value = w.word_family || '';
                }
            }
            document.getElementById('wordModal').classList.remove('hidden');
        }

        async function saveWord() {
            if (!document.getElementById('wordForm').checkValidity()) {
                document.getElementById('wordForm').reportValidity();
                return;
            }

            const id = document.getElementById('wordId').value;
            const payload = {
                word: document.getElementById('wordInput').value.trim(),
                phonetic: document.getElementById('phonetics').value.trim(),
                part_of_speech: document.getElementById('partOfSpeech').value.trim(),
                english_meaning: document.getElementById('englishMeaning').value.trim(),
                vietnamese_meaning: document.getElementById('vietnameseMeaning').value.trim(),
                synonyms: document.getElementById('synonyms').value.trim(),
                antonyms: document.getElementById('antonyms').value.trim(),
                collocations: document.getElementById('collocations').value.trim(),
                example: document.getElementById('exampleSentence').value.trim(),
                audio_url: document.getElementById('audioUrl').value,
                prefix: document.getElementById('prefix').value.trim(),
                root: document.getElementById('rootWord').value.trim(),
                suffix: document.getElementById('suffix').value.trim(),
                word_family: document.getElementById('wordFamily').value.trim()
            };

            try {
                if (id) {
                    const { error } = await supabaseClient.from('vocab_words').update(payload).eq('id', id);
                    if (error) throw error;
                } else {
                    const { error } = await supabaseClient.from('vocab_words').insert([payload]);
                    if (error) throw error;
                }
                closeModals();
                fetchData(); // Refresh list
            } catch (err) {
                console.error(err);
                alert("Error saving word: " + err.message);
            }
        }

        async function deleteWord(id) {
            if (confirm("Delete this word?")) {
                const { error } = await supabaseClient.from('vocab_words').delete().eq('id', id);
                if (!error) fetchData();
            }
        }

        async function fetchWordAPI() {
            const word = document.getElementById('wordInput').value.trim();
            const statusEl = document.getElementById('fetchStatus');
            if (!word) {
                statusEl.innerHTML = '<span class="text-red-500">Please enter a word first.</span>';
                return;
            }

            if (!geminiApiKey) {
                statusEl.innerHTML = '<span class="text-red-500">Please add Gemini API Key in Settings first.</span>';
                document.getElementById('configModal').classList.remove('hidden');
                return;
            }

            statusEl.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Analyzing with AI...';

            try {
                // 1. Get Audio URL from standard Dictionary API (AI cannot provide MP3 links)
                try {
                    const dictRes = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
                    if (dictRes.ok) {
                        const dictData = await dictRes.json();
                        const validPhonetic = dictData[0].phonetics.find(p => p.audio) || dictData[0].phonetics[0];
                        document.getElementById('audioUrl').value = validPhonetic?.audio || '';
                    }
                } catch (e) {
                    console.log("Dictionary API failed to find audio.");
                }

                // 2. Get Rich Structured Data from Gemini AI
                const prompt = `Act as an expert English linguistics dictionary. Analyze the word "${word}". 
                Return ONLY a valid, raw JSON object with the exact keys below. Do not include markdown formatting like \`\`\`json.
                If a field is not applicable (like no prefix), leave it as an empty string "".
                {
                    "phonetic": "UK or US phonetic transcription, e.g. /'ter.ər/",
                    "partOfSpeech": "primary part of speech, e.g. noun",
                    "englishMeaning": "Concise, clear English definition",
                    "vietnameseMeaning": "Accurate Vietnamese translation",
                    "synonyms": "comma-separated list of synonyms",
                    "antonyms": "comma-separated list of antonyms",
                    "collocations": "comma-separated list of common collocations",
                    "wordFamily": "comma-separated list of word family with POS (e.g. terrorize (v), terrorism (n))",
                    "prefix": "prefix used in the word, if any",
                    "root": "the etymological root word, if any",
                    "suffix": "suffix used in the word, if any",
                    "example": "A clear, well-structured example sentence"
                }`;

                const aiRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: {
                            temperature: 0.2, // Low temperature for factual, deterministic response
                            responseMimeType: "application/json"
                        }
                    })
                });

                if (!aiRes.ok) throw new Error('Gemini API Error');

                const aiData = await aiRes.json();
                const aiText = aiData.candidates[0].content.parts[0].text;

                // Parse the JSON string
                const wordData = JSON.parse(aiText);

                // Populate UI
                document.getElementById('phonetics').value = wordData.phonetic || '';
                document.getElementById('partOfSpeech').value = wordData.partOfSpeech || '';
                document.getElementById('englishMeaning').value = wordData.englishMeaning || '';
                document.getElementById('vietnameseMeaning').value = wordData.vietnameseMeaning || '';
                document.getElementById('synonyms').value = wordData.synonyms || '';
                document.getElementById('antonyms').value = wordData.antonyms || '';
                document.getElementById('collocations').value = wordData.collocations || '';
                document.getElementById('wordFamily').value = wordData.wordFamily || '';
                document.getElementById('prefix').value = wordData.prefix || '';
                document.getElementById('rootWord').value = wordData.root || '';
                document.getElementById('suffix').value = wordData.suffix || '';
                document.getElementById('exampleSentence').value = wordData.example || '';

                statusEl.innerHTML = '<span class="text-green-600 font-semibold"><i class="fas fa-check"></i> AI Analysis Complete!</span>';
            } catch (err) {
                console.error(err);
                statusEl.innerHTML = '<span class="text-red-500"><i class="fas fa-exclamation-circle"></i> AI Fetch failed. Check API Key.</span>';
            }
        }

        // --- SENTENCE STRUCTURES LOGIC ---
        function renderStructures(searchTerm = '') {
            const listEl = document.getElementById('structuresList');
            listEl.innerHTML = '';

            const term = searchTerm.toLowerCase();
            const filtered = structures.filter(s => {
                const inPurpose = s.purpose.toLowerCase().includes(term);
                const inKeywords = s.keywords ? s.keywords.some(k => k.toLowerCase().includes(term)) : false;
                const inPatterns = s.structures ? s.structures.some(p => p.toLowerCase().includes(term)) : false;
                return inPurpose || inKeywords || inPatterns;
            });

            if (filtered.length === 0) {
                listEl.innerHTML = `<p class="text-center text-gray-500 py-6">No structures found.</p>`;
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card cursor-pointer p-0 overflow-hidden';
                card.id = `struct-${item.id}`;

                // Formulate badges
                const keywordBadges = (item.keywords || []).map(k => `<span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded font-medium mr-1 mb-1 inline-block">${k}</span>`).join('');
                const structureList = (item.structures || []).map(s => `<li class="text-sm font-semibold text-gray-800"><i class="fas fa-angle-right text-green-500 mr-2"></i>${s}</li>`).join('');
                const examplesList = (item.examples || []).map(e => `<p class="text-sm italic text-gray-600 border-l-2 border-gray-300 pl-3 mb-2">"${e}"</p>`).join('');

                card.innerHTML = `
                    <div class="p-4 flex justify-between items-center bg-white hover:bg-gray-50 transition" onclick="toggleAccordion('${item.id}')">
                        <div>
                            <h3 class="text-lg font-bold text-gray-900">${item.purpose}</h3>
                            <div class="mt-2">${keywordBadges}</div>
                        </div>
                        <i id="icon-${item.id}" class="fas fa-chevron-down text-gray-400 transition-transform duration-300"></i>
                    </div>
                    
                    <div id="content-${item.id}" class="accordion-content bg-gray-50 border-t border-gray-100">
                        <div class="p-4 relative">
                            <div class="absolute top-2 right-2 flex gap-2">
                                <button onclick="openStructureModal('${item.id}'); event.stopPropagation();" class="text-blue-500 hover:text-blue-700 bg-white shadow-sm p-1.5 rounded"><i class="fas fa-pen text-sm"></i></button>
                                <button onclick="deleteStructure('${item.id}'); event.stopPropagation();" class="text-red-500 hover:text-red-700 bg-white shadow-sm p-1.5 rounded"><i class="fas fa-trash text-sm"></i></button>
                            </div>
                            
                            <div class="mb-4 pr-16">
                                <h4 class="text-xs uppercase text-gray-500 font-bold mb-2">Applicable Structures</h4>
                                <ul class="space-y-1">${structureList}</ul>
                            </div>
                            
                            <div>
                                <h4 class="text-xs uppercase text-gray-500 font-bold mb-2">Examples</h4>
                                ${examplesList}
                            </div>
                        </div>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        function toggleAccordion(id) {
            const content = document.getElementById(`content-${id}`);
            const icon = document.getElementById(`icon-${id}`);

            if (content.classList.contains('expanded')) {
                content.classList.remove('expanded');
                icon.style.transform = 'rotate(0deg)';
            } else {
                content.classList.add('expanded');
                icon.style.transform = 'rotate(180deg)';
            }
        }

        function openStructureModal(id = null) {
            const form = document.getElementById('structureForm');
            form.reset();
            document.getElementById('structureId').value = '';
            document.getElementById('structureModalTitle').innerText = id ? 'Edit Structure' : 'Add Structure';

            if (id) {
                const s = structures.find(x => x.id === id);
                if (s) {
                    document.getElementById('structureId').value = s.id;
                    document.getElementById('structPurpose').value = s.purpose;
                    document.getElementById('structKeywords').value = (s.keywords || []).join(', ');
                    document.getElementById('structPatterns').value = (s.structures || []).join(', ');
                    document.getElementById('structExamples').value = (s.examples || []).join('\n');
                }
            }
            document.getElementById('structureModal').classList.remove('hidden');
        }

        async function saveStructure() {
            if (!document.getElementById('structureForm').checkValidity()) {
                document.getElementById('structureForm').reportValidity();
                return;
            }

            const id = document.getElementById('structureId').value;

            // Helper to parse comma/newline separated arrays
            const parseArray = (str, separator) => str.split(separator).map(s => s.trim()).filter(s => s);

            const payload = {
                purpose: document.getElementById('structPurpose').value.trim(),
                keywords: parseArray(document.getElementById('structKeywords').value, ','),
                structures: parseArray(document.getElementById('structPatterns').value, ','),
                examples: parseArray(document.getElementById('structExamples').value, '\n')
            };

            try {
                if (id) {
                    const { error } = await supabaseClient.from('sentence_structures').update(payload).eq('id', id);
                    if (error) throw error;
                } else {
                    const { error } = await supabaseClient.from('sentence_structures').insert([payload]);
                    if (error) throw error;
                }
                closeModals();
                fetchData();
            } catch (err) {
                console.error(err);
                alert("Error saving structure: " + err.message);
            }
        }

        async function deleteStructure(id) {
            if (confirm("Delete this structure block?")) {
                const { error } = await supabaseClient.from('sentence_structures').delete().eq('id', id);
                if (!error) fetchData();
            }
        }

        // Link navigation from Vocab to Structure
        window.jumpToStructure = (structId) => {
            switchTab('structures');
            setTimeout(() => {
                const targetCard = document.getElementById(`struct-${structId}`);
                if (targetCard) {
                    targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    // Open it if not opened
                    const content = document.getElementById(`content-${structId}`);
                    if (!content.classList.contains('expanded')) {
                        toggleAccordion(structId);
                    }
                    // Flash effect
                    targetCard.classList.add('ring-4', 'ring-green-200');
                    setTimeout(() => targetCard.classList.remove('ring-4', 'ring-green-200'), 1500);
                }
            }, 100);
        };

        function closeModals() {
            document.getElementById('wordModal').classList.add('hidden');
            document.getElementById('structureModal').classList.add('hidden');
        }
    </script>
