<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Open Graph (OG Meta Tags) -->
    <meta property="og:image" content="https://h2mvocab.vercel.app/image/favicon.png" />
    <meta property="og:title" content="H2M Vocabulary Builder" />
    <meta property="og:description" content="My personal dictionary" />
    <meta property="og:url" content="https://h2mvocab.vercel.app" />

    <title>H2M Vocabulary Builder</title>
    <link rel="icon" type="image/x-icon" href="./image/favicon.png">


    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .card {
            background-color: white;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            transition: all 0.3s ease;
            position: relative;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }
        .speaker-icon {
            cursor: pointer;
            color: #4B5563; /* Gray-600 */
            transition: color 0.2s ease;
        }
        .speaker-icon:hover {
            color: #2563EB; /* Blue-600 */
        }
        .action-btn {
            opacity: 0.6;
            transition: opacity 0.2s;
            cursor: pointer;
        }
        .action-btn:hover {
            opacity: 1;
        }
        .add-word-fab {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background-color: #3B82F6; /* Blue-500 */
            color: white;
            width: 4rem;
            height: 4rem;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            cursor: pointer;
            transition: background-color 0.3s;
            z-index: 40;
        }
        .add-word-fab:hover {
             background-color: #2563EB; /* Blue-600 */
        }
        /* Custom scrollbar for modal */
        .modal-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .modal-scroll::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        .modal-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .modal-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="bg-gray-100">

    <div class="container mx-auto max-w-2xl p-4 sm:p-6 lg:p-8 pb-24">
        <header class="mb-8">
            <div class="flex items-center gap-4 sm:gap-6">
                <img src="./image/H2M_logo.png" alt="H2M logo" class="w-24 h-24 sm:w-28 sm:h-28">
                <div>
                    <h1 class="text-4xl font-bold text-gray-800 leading-tight">Vocabulary Builder</h1>
                    <p class="text-gray-600 mt-2">My personal dictionary</p>
                </div>
            </div>
        </header>
        <div id="translatorSection" class="mb-6 bg-white rounded-xl p-4 shadow-sm border border-gray-100">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                <p id="databaseStatus" class="text-sm text-gray-600">Database: connecting...</p>
                <div class="flex flex-wrap gap-2">
                    <button id="refreshDbBtn" class="px-3 py-2 text-sm rounded-lg bg-blue-100 text-blue-700 hover:bg-blue-200 transition-colors">
                        <i class="fas fa-rotate mr-1"></i> Refresh
                    </button>
                </div>
            </div>
        </div>

        <!-- Two-way Translator + Dictionary -->
        <div class="mb-6 bg-white rounded-xl p-4 shadow-sm border border-gray-100">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-xl font-bold text-gray-800">Translator + Dictionary</h2>
                <span class="text-xs text-gray-500">Google Translate / AI Rewrite</span>
            </div>

            <div class="mb-3 grid grid-cols-1 sm:grid-cols-2 gap-2">
                <select id="viEnDirection" class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="vi-en">Vietnamese -> English</option>
                    <option value="en-vi">English -> Vietnamese</option>
                </select>
                <div class="px-3 py-2 border border-gray-300 rounded-lg text-sm bg-gray-50 text-gray-700">
                    AI Provider: <span class="font-semibold">Gemini 3.1 Flash-Lite</span>
                </div>
            </div>

            <div class="flex gap-2 mb-3">
                <textarea id="viInput" rows="2" class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 resize-none" placeholder="Nhập từ hoặc câu tiếng Việt..."></textarea>
                <button id="viTranslateBtn" class="self-start px-4 py-3 rounded-lg bg-blue-600 text-white font-semibold hover:bg-blue-700 transition-colors">
                    Translate
                </button>
            </div>
            <p id="viTranslateStatus" class="text-sm text-gray-500 mb-3 min-h-[20px]"></p>

            <div class="mb-3 flex gap-2">
                <button id="viTabTranslation" class="px-4 py-2 rounded-lg text-sm font-semibold bg-blue-600 text-white">Translation</button>
                <button id="viTabDefinition" class="px-4 py-2 rounded-lg text-sm font-semibold bg-gray-200 text-gray-700">Definition</button>
            </div>

            <div id="viTranslationPanel" class="bg-gray-50 rounded-lg p-4">
                <p id="viResultLabel" class="text-sm text-gray-500 mb-2">English Translation</p>
                <p id="viEnResult" class="text-2xl font-bold text-gray-900">-</p>
                <div class="mt-3 flex flex-wrap gap-2">
                    <button id="viEnSpeakBtn" class="px-3 py-1.5 rounded-md text-gray-600 bg-white border border-gray-300 hover:text-blue-600 hover:border-blue-400" title="Speak translation">
                        <i class="fas fa-volume-up mr-1"></i> Speak
                    </button>
                    <button id="saveFromTranslateBtn" class="px-3 py-1.5 rounded-md text-green-700 bg-green-50 border border-green-200 hover:bg-green-100" title="Save to vocabulary">
                        <i class="fas fa-bookmark mr-1"></i> Save to Vocabulary
                    </button>
                    <button id="aiRewriteBtn" class="px-3 py-1.5 rounded-md text-purple-700 bg-purple-50 border border-purple-200 hover:bg-purple-100" title="Rewrite with AI">
                        <i class="fas fa-wand-magic-sparkles mr-1"></i> AI Rewrite
                    </button>
                </div>
            </div>

            <div id="viDefinitionPanel" class="bg-gray-50 rounded-lg p-4 hidden">
                <p class="text-sm text-gray-500 mb-2">English Word Definition</p>
                <p id="viDefWord" class="text-2xl font-bold text-gray-900 mb-1">-</p>
                <div class="flex items-center gap-2 mb-2">
                    <span id="viDefPhonetic" class="text-gray-600 italic">-</span>
                    <span id="viDefPos" class="text-xs font-semibold bg-gray-200 text-gray-700 px-2 py-0.5 rounded">-</span>
                </div>
                <p id="viDefMeaning" class="text-gray-800 mb-2">-</p>
                <p id="viDefExample" class="text-gray-600 italic">-</p>
            </div>
        </div>
        
        <!-- Search Input -->
        <div class="mb-8">
            <div class="relative">
                <input type="text" id="searchInput" placeholder="Search for a word..." class="w-full px-4 py-3 pl-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                <i class="fas fa-search absolute left-3 top-4 text-gray-400"></i>
            </div>
        </div>

        <!-- View Toggle -->
        <div class="mb-6 flex gap-2">
            <button id="allWordsTab" class="px-4 py-2 rounded-lg text-sm font-semibold bg-blue-600 text-white">
                All Words
            </button>
            <button id="favoritesTab" class="px-4 py-2 rounded-lg text-sm font-semibold bg-gray-200 text-gray-700">
                Favorites (<span id="favoritesCount">0</span>)
            </button>
            <button id="recencyTab" class="px-4 py-2 rounded-lg text-sm font-semibold bg-gray-200 text-gray-700">
                Recency
            </button>
        </div>

        <!-- Vocabulary List -->
        <div id="vocabularyList">
            <!-- Vocabulary cards will be inserted here by JavaScript -->
        </div>

    </div>
    
    <!-- Add Word Floating Action Button -->
    <div id="addWordBtn" class="add-word-fab">
        <i class="fas fa-plus fa-lg"></i>
    </div>

    <!-- Add/Edit Word Modal -->
    <div id="wordModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-lg flex flex-col max-h-[90vh]">
            
            <!-- Modal Header -->
            <div class="p-6 border-b border-gray-200 flex justify-between items-center bg-gray-50 rounded-t-lg">
                <h2 id="modalTitle" class="text-2xl font-bold text-gray-800">Add a New Word</h2>
                <button id="closeModalBtn" class="text-gray-400 hover:text-gray-600 transition-colors">
                    <i class="fas fa-times fa-lg"></i>
                </button>
            </div>

            <!-- Modal Body (Scrollable) -->
            <div class="p-6 overflow-y-auto modal-scroll">
                <form id="wordForm">
                    <input type="hidden" id="wordId">
                    <input type="hidden" id="audioUrl">

                    <!-- Word & Fetch -->
                    <div class="mb-4">
                        <label for="wordInput" class="block text-gray-700 font-medium mb-1">Word <span class="text-red-500">*</span></label>
                        <div class="flex gap-2">
                            <input type="text" id="wordInput" class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required placeholder="e.g., Serendipity">
                            <button type="button" id="fetchWordDataBtn" class="bg-blue-100 text-blue-700 px-4 py-2 rounded-lg hover:bg-blue-200 font-semibold transition-colors flex items-center gap-2">
                                <i class="fas fa-cloud-download-alt"></i> Fetch
                            </button>
                        </div>
                        <p id="fetchStatus" class="text-sm text-gray-500 mt-1 h-5"></p>
                    </div>

                    <!-- Phonetics & POS -->
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label for="phonetics" class="block text-gray-700 font-medium mb-1">Phonetics</label>
                            <input type="text" id="phonetics" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="/.../">
                        </div>
                        <div>
                            <label for="partOfSpeech" class="block text-gray-700 font-medium mb-1">Part of Speech</label>
                            <input type="text" id="partOfSpeech" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="noun, verb...">
                        </div>
                    </div>

                    <!-- Meanings -->
                    <div class="mb-4">
                        <label for="englishMeaning" class="block text-gray-700 font-medium mb-1">English Meaning <span class="text-red-500">*</span></label>
                        <input type="text" id="englishMeaning" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required placeholder="Definition...">
                    </div>
                     <div class="mb-4">
                        <label for="vietnameseMeaning" class="block text-gray-700 font-medium mb-1">Vietnamese Meaning</label>
                        <input type="text" id="vietnameseMeaning" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Nghĩa tiếng Việt...">
                    </div>

                    <!-- Extras: Synonyms, Antonyms, Collocations -->
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label for="synonyms" class="block text-gray-700 font-medium mb-1">Synonyms</label>
                            <input type="text" id="synonyms" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="happy, joyful...">
                        </div>
                        <div>
                            <label for="antonyms" class="block text-gray-700 font-medium mb-1">Antonyms</label>
                            <input type="text" id="antonyms" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="sad, upset...">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="collocations" class="block text-gray-700 font-medium mb-1">Collocations</label>
                        <input type="text" id="collocations" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="go to school, make a decision...">
                    </div>

                    <!-- Example -->
                    <div class="mb-4">
                        <label for="exampleSentence" class="block text-gray-700 font-medium mb-1">Example Sentence</label>
                        <textarea id="exampleSentence" rows="2" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Use the word in a sentence..."></textarea>
                    </div>
                </form>
            </div>

            <!-- Modal Footer -->
            <div class="p-6 border-t border-gray-200 bg-gray-50 rounded-b-lg flex justify-end gap-3">
                <button type="button" id="cancelBtn" class="px-6 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100 font-medium transition-colors">Cancel</button>
                <button type="submit" form="wordForm" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 font-bold transition-colors shadow-lg shadow-blue-500/30">Save Word</button>
            </div>
        </div>
    </div>

    <script src="./config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- Elements ---
            const vocabularyList = document.getElementById('vocabularyList');
            const searchInput = document.getElementById('searchInput');
            const addWordBtn = document.getElementById('addWordBtn');
            const modal = document.getElementById('wordModal');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const cancelBtn = document.getElementById('cancelBtn');
            const wordForm = document.getElementById('wordForm');
            const fetchWordDataBtn = document.getElementById('fetchWordDataBtn');
            const fetchStatus = document.getElementById('fetchStatus');
            const modalTitle = document.getElementById('modalTitle');
            const refreshDbBtn = document.getElementById('refreshDbBtn');
            const databaseStatus = document.getElementById('databaseStatus');
            const translatorSection = document.getElementById('translatorSection');
            const viEnDirection = document.getElementById('viEnDirection');
            const viInput = document.getElementById('viInput');
            const viTranslateBtn = document.getElementById('viTranslateBtn');
            const viTranslateStatus = document.getElementById('viTranslateStatus');
            const viTabTranslation = document.getElementById('viTabTranslation');
            const viTabDefinition = document.getElementById('viTabDefinition');
            const viTranslationPanel = document.getElementById('viTranslationPanel');
            const viDefinitionPanel = document.getElementById('viDefinitionPanel');
            const viResultLabel = document.getElementById('viResultLabel');
            const viEnResult = document.getElementById('viEnResult');
            const viEnSpeakBtn = document.getElementById('viEnSpeakBtn');
            const saveFromTranslateBtn = document.getElementById('saveFromTranslateBtn');
            const aiRewriteBtn = document.getElementById('aiRewriteBtn');
            const viDefWord = document.getElementById('viDefWord');
            const viDefPhonetic = document.getElementById('viDefPhonetic');
            const viDefPos = document.getElementById('viDefPos');
            const viDefMeaning = document.getElementById('viDefMeaning');
            const viDefExample = document.getElementById('viDefExample');
            const allWordsTab = document.getElementById('allWordsTab');
            const favoritesTab = document.getElementById('favoritesTab');
            const recencyTab = document.getElementById('recencyTab');
            const favoritesCount = document.getElementById('favoritesCount');

            // --- State ---
            let words = [];
            let currentView = 'all';
            let viEnActiveTab = 'translation';
            let latestTranslation = '';
            let latestTranslationData = {
                sourceText: '',
                translatedText: '',
                direction: 'vi-en',
                englishText: '',
                vietnameseText: '',
                englishWord: ''
            };
            const SUPABASE_TABLE = 'vocab_words';
            const TRANSLATOR_SETTINGS_KEY = 'vocab_translator_settings_v1';
            const SUPABASE_URL = window.VOCAB_SUPABASE_URL || 'https://xayeekqcwtqvmqqubqlq.supabase.co';
            const SUPABASE_ANON_KEY = window.VOCAB_SUPABASE_ANON_KEY || 'sb_publishable_dYl1w0ezah4j6LS27m17EA_7Ppc8Qas';
            const CONFIG_GEMINI_API_KEY = (typeof window.VOCAB_GEMINI_API_KEY === 'string' ? window.VOCAB_GEMINI_API_KEY : '').trim();
            const FIXED_AI_MODEL = 'gemini-3.1-flash-lite';
            const isSupabaseConfigured =
                Boolean(SUPABASE_URL) &&
                Boolean(SUPABASE_ANON_KEY);
            const supabaseClient = (window.supabase && isSupabaseConfigured)
                ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
                : null;

            // --- Helper Functions ---

            const setDatabaseStatus = (message, type = 'neutral') => {
                const colorMap = {
                    neutral: 'text-gray-600',
                    ok: 'text-green-700',
                    warn: 'text-amber-700',
                    error: 'text-red-600'
                };

                databaseStatus.className = `text-sm ${colorMap[type] || colorMap.neutral}`;
                databaseStatus.textContent = message;
            };

            const safeReadString = (value) => (typeof value === 'string' ? value : '');

            const ensureArray = (value) => {
                if (Array.isArray(value)) return value;
                if (typeof value === 'string' && value.trim()) {
                    return value.split(',').map(item => item.trim()).filter(Boolean);
                }
                return [];
            };

            const dbRowToAppWord = (row) => {
                return {
                    id: String(row.id),
                    word: safeReadString(row.word).trim(),
                    phonetic: safeReadString(row.phonetic).trim(),
                    partOfSpeech: safeReadString(row.part_of_speech).trim(),
                    englishMeaning: safeReadString(row.english_meaning).trim(),
                    vietnameseMeaning: safeReadString(row.vietnamese_meaning).trim(),
                    example: safeReadString(row.example_sentence).trim(),
                    synonyms: safeReadString(row.synonyms).trim(),
                    antonyms: safeReadString(row.antonyms).trim(),
                    collocations: safeReadString(row.collocations).trim(),
                    audioUrl: safeReadString(row.audio_url).trim(),
                    favorite: Boolean(row.favorite),
                    createdAt: row.created_at || new Date().toISOString(),
                    updatedAt: row.updated_at || new Date().toISOString()
                };
            };

            const appWordToDbPayload = (wordData) => {
                return {
                    word: safeReadString(wordData.word).trim(),
                    phonetic: safeReadString(wordData.phonetic).trim(),
                    part_of_speech: safeReadString(wordData.partOfSpeech).trim(),
                    english_meaning: safeReadString(wordData.englishMeaning).trim(),
                    vietnamese_meaning: safeReadString(wordData.vietnameseMeaning).trim(),
                    synonyms: safeReadString(wordData.synonyms).trim(),
                    antonyms: safeReadString(wordData.antonyms).trim(),
                    collocations: safeReadString(wordData.collocations).trim(),
                    example_sentence: safeReadString(wordData.example).trim(),
                    audio_url: safeReadString(wordData.audioUrl).trim(),
                    favorite: Boolean(wordData.favorite),
                    updated_at: new Date().toISOString()
                };
            };

            const loadData = async () => {
                if (!supabaseClient) {
                    setDatabaseStatus('Database not configured. Set Supabase URL and anon key in index.html.', 'error');
                    words = [];
                    applyFilters();
                    return;
                }

                const { data, error } = await supabaseClient
                    .from(SUPABASE_TABLE)
                    .select('*')
                    .order('updated_at', { ascending: false });

                if (error) {
                    console.error(error);
                    setDatabaseStatus(`Database error: ${error.message}`, 'error');
                    return;
                }

                words = (data || []).map(dbRowToAppWord);
                setDatabaseStatus(`Database connected. ${words.length} words loaded.`, 'ok');
                applyFilters();
            };

            const escapeHtml = (unsafe = '') => {
                return String(unsafe)
                    .replaceAll('&', '&amp;')
                    .replaceAll('<', '&lt;')
                    .replaceAll('>', '&gt;')
                    .replaceAll('"', '&quot;')
                    .replaceAll("'", '&#039;');
            };

            const escapeForSingleQuoteJs = (unsafe = '') => {
                return String(unsafe)
                    .replaceAll('\\', '\\\\')
                    .replaceAll("'", "\\'");
            };

            const uniqueNormalizedList = (items = [], max = 8) => {
                const seen = new Set();
                const cleaned = [];

                for (const raw of items) {
                    const value = safeReadString(raw).trim();
                    if (!value) continue;
                    const key = value.toLowerCase();
                    if (seen.has(key)) continue;
                    seen.add(key);
                    cleaned.push(value);
                    if (cleaned.length >= max) break;
                }

                return cleaned;
            };

            const buildFallbackExample = (word, partOfSpeech) => {
                if (!word) return '';
                if (partOfSpeech === 'verb') return `I try to ${word} every day to improve my English.`;
                if (partOfSpeech === 'adjective') return `The teacher gave us a very ${word} explanation.`;
                return `I learned a new word today: "${word}".`;
            };

            const fetchDatamuseWords = async (query) => {
                const response = await fetch(`https://api.datamuse.com/words?${query}`);
                if (!response.ok) throw new Error('Datamuse request failed');
                const data = await response.json();
                return Array.isArray(data) ? data.map(item => item.word).filter(Boolean) : [];
            };

            const fetchVietnameseMeaning = async (englishText) => {
                if (!englishText) return '';

                const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(englishText)}&langpair=en|vi`);
                if (!response.ok) throw new Error('Translation request failed');

                const data = await response.json();
                const translated = safeReadString(data?.responseData?.translatedText).trim();
                if (!translated) return '';
                return translated.replace(/\s+/g, ' ');
            };

            const setViTab = (tab) => {
                viEnActiveTab = tab;
                if (tab === 'definition') {
                    viTabDefinition.className = 'px-4 py-2 rounded-lg text-sm font-semibold bg-blue-600 text-white';
                    viTabTranslation.className = 'px-4 py-2 rounded-lg text-sm font-semibold bg-gray-200 text-gray-700';
                    viDefinitionPanel.classList.remove('hidden');
                    viTranslationPanel.classList.add('hidden');
                } else {
                    viTabTranslation.className = 'px-4 py-2 rounded-lg text-sm font-semibold bg-blue-600 text-white';
                    viTabDefinition.className = 'px-4 py-2 rounded-lg text-sm font-semibold bg-gray-200 text-gray-700';
                    viTranslationPanel.classList.remove('hidden');
                    viDefinitionPanel.classList.add('hidden');
                }
            };

            const loadTranslatorSettings = () => {
                const raw = localStorage.getItem(TRANSLATOR_SETTINGS_KEY);
                if (!raw) return;
                try {
                    const parsed = JSON.parse(raw);
                    const direction = safeReadString(parsed.direction) || 'vi-en';
                    viEnDirection.value = direction === 'en-vi' ? 'en-vi' : 'vi-en';
                } catch (error) {
                    console.error(error);
                }
            };

            const saveTranslatorSettings = () => {
                const payload = {
                    direction: viEnDirection.value
                };
                localStorage.setItem(TRANSLATOR_SETTINGS_KEY, JSON.stringify(payload));
            };

            const fetchGeminiSupportedModels = async (apiKey) => {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(apiKey)}`);
                if (!response.ok) return [];
                const data = await response.json();
                const models = Array.isArray(data?.models) ? data.models : [];
                return models
                    .filter(model => Array.isArray(model.supportedGenerationMethods) && model.supportedGenerationMethods.includes('generateContent'))
                    .map(model => safeReadString(model.name).replace(/^models\//, ''))
                    .filter(Boolean);
            };

            const getGeminiModelCandidates = (preferredModel, supportedModels) => {
                const fallbackDefaults = [FIXED_AI_MODEL, 'gemini-2.0-flash', 'gemini-2.0-flash-lite', 'gemini-1.5-flash-latest', 'gemini-1.5-pro-latest'];
                const all = [preferredModel, ...fallbackDefaults, ...(supportedModels || [])]
                    .map(item => safeReadString(item).replace(/^models\//, '').trim())
                    .filter(Boolean);
                return [...new Set(all)];
            };

            const updateTranslatorDirectionUI = () => {
                const isViToEn = viEnDirection.value === 'vi-en';
                viInput.placeholder = isViToEn
                    ? 'Nhập từ hoặc câu tiếng Việt...'
                    : 'Enter English word or sentence...';
                viResultLabel.textContent = isViToEn ? 'English Translation' : 'Vietnamese Translation';
            };

            const parsePrimaryEnglishWord = (translatedText) => {
                const match = safeReadString(translatedText).toLowerCase().match(/[a-z]+(?:'[a-z]+)?/);
                return match ? match[0] : '';
            };

            const fetchGoogleTranslate = async (text, sourceLang, targetLang) => {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Google Translate request failed');
                const data = await response.json();
                const translated = Array.isArray(data?.[0]) ? data[0].map(item => item?.[0] || '').join('') : '';
                return safeReadString(translated).trim();
            };

            const fetchFallbackTranslate = async (text, sourceLang, targetLang) => {
                const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${sourceLang}|${targetLang}`);
                if (!response.ok) throw new Error('Fallback translate request failed');
                const data = await response.json();
                return safeReadString(data?.responseData?.translatedText).trim();
            };

            const resetDefinitionPanel = () => {
                viDefWord.textContent = '-';
                viDefPhonetic.textContent = '-';
                viDefPos.textContent = '-';
                viDefMeaning.textContent = '-';
                viDefExample.textContent = '-';
            };

            const loadEnglishDefinition = async (englishText) => {
                const primaryWord = parsePrimaryEnglishWord(englishText);
                if (!primaryWord) {
                    resetDefinitionPanel();
                    return;
                }

                try {
                    const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(primaryWord)}`);
                    if (!response.ok) throw new Error('Definition not found');
                    const data = await response.json();
                    const entry = data[0] || {};
                    const phonetics = Array.isArray(entry.phonetics) ? entry.phonetics : [];
                    const validPhonetic = phonetics.find(p => p.text) || {};
                    const meaning = Array.isArray(entry.meanings) ? entry.meanings[0] : null;
                    const definition = meaning && Array.isArray(meaning.definitions) ? meaning.definitions[0] : null;

                    viDefWord.textContent = primaryWord;
                    viDefPhonetic.textContent = safeReadString(validPhonetic.text) || '-';
                    viDefPos.textContent = safeReadString(meaning?.partOfSpeech) || '-';
                    viDefMeaning.textContent = safeReadString(definition?.definition) || 'No definition available.';
                    viDefExample.textContent = safeReadString(definition?.example) || 'No example sentence.';
                } catch (error) {
                    viDefWord.textContent = primaryWord;
                    viDefPhonetic.textContent = '-';
                    viDefPos.textContent = '-';
                    viDefMeaning.textContent = 'Definition not available from online dictionary.';
                    viDefExample.textContent = '-';
                }
            };

            const translateTextByDirection = async () => {
                const sourceText = viInput.value.trim();
                if (!sourceText) {
                    viTranslateStatus.textContent = 'Please enter text first.';
                    return;
                }

                viTranslateStatus.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Translating...';

                const sourceLang = viEnDirection.value === 'vi-en' ? 'vi' : 'en';
                const targetLang = viEnDirection.value === 'vi-en' ? 'en' : 'vi';
                let translated = '';
                try {
                    translated = await fetchGoogleTranslate(sourceText, sourceLang, targetLang);
                } catch (error) {
                    try {
                        translated = await fetchFallbackTranslate(sourceText, sourceLang, targetLang);
                    } catch (fallbackError) {
                        console.error(fallbackError);
                    }
                }

                if (!translated) {
                    viTranslateStatus.innerHTML = '<span class="text-red-500"><i class="fas fa-exclamation-circle"></i> Translation failed. Please try again.</span>';
                    return;
                }

                latestTranslation = translated;
                viEnResult.textContent = translated;

                const englishText = viEnDirection.value === 'vi-en' ? translated : sourceText;
                const vietnameseText = viEnDirection.value === 'vi-en' ? sourceText : translated;
                latestTranslationData = {
                    sourceText,
                    translatedText: translated,
                    direction: viEnDirection.value,
                    englishText,
                    vietnameseText,
                    englishWord: parsePrimaryEnglishWord(englishText)
                };

                await loadEnglishDefinition(englishText);
                viTranslateStatus.innerHTML = '<span class="text-green-600"><i class="fas fa-check"></i> Translation ready.</span>';
            };

            const rewriteWithAI = async () => {
                if (!latestTranslationData.sourceText || !latestTranslationData.translatedText) {
                    viTranslateStatus.innerHTML = '<span class="text-amber-600"><i class="fas fa-info-circle"></i> Translate first, then use AI rewrite.</span>';
                    return;
                }

                const apiKey = CONFIG_GEMINI_API_KEY;
                const model = FIXED_AI_MODEL;

                if (!apiKey) {
                    viTranslateStatus.innerHTML = '<span class="text-amber-600"><i class="fas fa-key"></i> Missing Gemini API key in config.js (`VOCAB_GEMINI_API_KEY`).</span>';
                    return;
                }

                viTranslateStatus.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Rewriting with AI...';

                const sourceLabel = latestTranslationData.direction === 'vi-en' ? 'Vietnamese' : 'English';
                const targetLabel = latestTranslationData.direction === 'vi-en' ? 'English' : 'Vietnamese';
                const prompt = `Improve this ${targetLabel} translation for naturalness and clarity. Return only the improved translation.\nSource (${sourceLabel}): ${latestTranslationData.sourceText}\nCurrent translation (${targetLabel}): ${latestTranslationData.translatedText}`;

                let improved = '';
                try {
                    const supportedModels = await fetchGeminiSupportedModels(apiKey);
                    const candidates = getGeminiModelCandidates(model, supportedModels);
                    let lastGeminiError = '';

                    for (const candidate of candidates) {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(candidate)}:generateContent?key=${encodeURIComponent(apiKey)}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: prompt }] }]
                            })
                        });

                        if (!response.ok) {
                            const errBody = await response.text();
                            lastGeminiError = errBody;
                            continue;
                        }

                        const data = await response.json();
                        improved = safeReadString(data?.candidates?.[0]?.content?.parts?.[0]?.text).trim();
                        if (improved) {
                            break;
                        }
                    }

                    if (!improved) {
                        const modelHint = supportedModels.length
                            ? ` Available models: ${supportedModels.slice(0, 5).join(', ')}`
                            : '';
                        throw new Error(`Gemini request failed: ${lastGeminiError || 'No valid model response.'}${modelHint}`);
                    }
                } catch (error) {
                    console.error(error);
                    const message = safeReadString(error?.message).slice(0, 240) || 'Unknown error';
                    viTranslateStatus.innerHTML = `<span class="text-red-500"><i class="fas fa-exclamation-circle"></i> AI rewrite failed: ${escapeHtml(message)}</span>`;
                    return;
                }

                if (!improved) {
                    viTranslateStatus.innerHTML = '<span class="text-red-500"><i class="fas fa-exclamation-circle"></i> AI returned empty result.</span>';
                    return;
                }

                latestTranslation = improved;
                latestTranslationData.translatedText = improved;
                if (latestTranslationData.direction === 'vi-en') {
                    latestTranslationData.englishText = improved;
                    latestTranslationData.englishWord = parsePrimaryEnglishWord(improved);
                    await loadEnglishDefinition(improved);
                } else {
                    latestTranslationData.vietnameseText = improved;
                }

                viEnResult.textContent = improved;
                viTranslateStatus.innerHTML = '<span class="text-green-600"><i class="fas fa-check"></i> AI rewrite complete.</span>';
            };

            /** Play Audio */
            window.playAudio = (url, textFallback) => {
                if (url && url !== "undefined") {
                    const audio = new Audio(url);
                    audio.play().catch(e => {
                        console.warn("Audio play failed, falling back to TTS", e);
                        speak(textFallback);
                    });
                } else {
                    speak(textFallback);
                }
            };

            /** TTS Fallback */
            const speak = (text) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel(); // Stop any current speech
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'en-US';
                    window.speechSynthesis.speak(utterance);
                }
            };

            // --- Rendering ---

            const renderWords = (list) => {
                vocabularyList.innerHTML = '';
                if (list.length === 0) {
                    const searchTerm = searchInput.value.trim();
                    const canSuggestAdd =
                        currentView === 'all' &&
                        Boolean(searchTerm) &&
                        !words.some(item => safeReadString(item.word).toLowerCase() === searchTerm.toLowerCase());

                    if (currentView === 'favorites') {
                        vocabularyList.innerHTML = `<div class="text-center py-10 text-gray-500"><i class="fas fa-star text-4xl mb-3 opacity-30"></i><p>No favorite words yet. Tap the star icon on any word.</p></div>`;
                        return;
                    }

                    if (currentView === 'recency') {
                        vocabularyList.innerHTML = `<div class="text-center py-10 text-gray-500"><i class="fas fa-clock-rotate-left text-4xl mb-3 opacity-30"></i><p>No recently added words yet.</p></div>`;
                        return;
                    }

                    if (canSuggestAdd) {
                        const safeSearchTerm = escapeHtml(searchTerm);
                        const escapedSearchTermJs = escapeForSingleQuoteJs(searchTerm);
                        vocabularyList.innerHTML = `
                            <div class="text-center py-10 text-gray-500">
                                <i class="fas fa-search text-4xl mb-3 opacity-30"></i>
                                <p class="mb-4">No word found for "<span class="font-semibold text-gray-700">${safeSearchTerm}</span>".</p>
                                <button onclick="suggestAddWord('${escapedSearchTermJs}')" class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                                    <i class="fas fa-plus"></i>
                                    Add "${safeSearchTerm}"
                                </button>
                            </div>
                        `;
                        return;
                    }

                    vocabularyList.innerHTML = `<div class="text-center py-10 text-gray-500"><i class="fas fa-book-open text-4xl mb-3 opacity-30"></i><p>No words found. Add some to get started!</p></div>`;
                    return;
                }

                list.forEach(item => {
                    // Create tags for extras
                    const safeWord = escapeHtml(item.word);
                    const safePhonetic = escapeHtml(item.phonetic || '');
                    const safePos = escapeHtml(item.partOfSpeech || 'unknown');
                    const safeEnglishMeaning = escapeHtml(item.englishMeaning || '');
                    const safeVietnameseMeaning = escapeHtml(item.vietnameseMeaning || '');
                    const safeSynonyms = escapeHtml(item.synonyms || '');
                    const safeAntonyms = escapeHtml(item.antonyms || '');
                    const safeCollocations = escapeHtml(item.collocations || '');
                    const safeExample = escapeHtml(item.example || '');
                    const escapedId = encodeURIComponent(item.id);
                    const safeAudioUrl = escapeForSingleQuoteJs(item.audioUrl || '');
                    const wordForJs = escapeForSingleQuoteJs(item.word || '');
                    const exampleForJs = escapeForSingleQuoteJs(item.example || '');
                    const favoriteIconClass = item.favorite ? 'fas fa-star text-yellow-400' : 'far fa-star text-gray-400 hover:text-yellow-400';

                    const synonymsHtml = item.synonyms ? `<p class="text-sm text-gray-600 mt-1"><span class="font-semibold text-green-600">Syn:</span> ${safeSynonyms}</p>` : '';
                    const antonymsHtml = item.antonyms ? `<p class="text-sm text-gray-600 mt-1"><span class="font-semibold text-red-500">Ant:</span> ${safeAntonyms}</p>` : '';
                    const collocationsHtml = item.collocations ? `<p class="text-sm text-gray-600 mt-1"><span class="font-semibold text-blue-600">Col:</span> ${safeCollocations}</p>` : '';
                    
                    const card = document.createElement('div');
                    card.className = 'card group';
                    card.innerHTML = `
                        <!-- Favorite Star -->
                        <button onclick="toggleFavorite(decodeURIComponent('${escapedId}'))" class="absolute top-4 left-4 focus:outline-none" title="Favorite">
                            <i class="${favoriteIconClass} text-xl transition-colors"></i>
                        </button>

                        <!-- Action Buttons (Edit/Delete) -->
                        <div class="absolute top-4 right-4 flex gap-3 opacity-0 group-hover:opacity-100 transition-opacity">
                            <i class="fas fa-pen action-btn text-blue-500 hover:text-blue-700" onclick="openEditModal(decodeURIComponent('${escapedId}'))" title="Edit"></i>
                            <i class="fas fa-trash action-btn text-red-500 hover:text-red-700" onclick="deleteWord(decodeURIComponent('${escapedId}'))" title="Delete"></i>
                        </div>

                        <!-- Header -->
                        <div class="flex items-center mb-1 ml-8">
                            <h2 class="text-2xl font-bold text-gray-900 mr-3">${safeWord}</h2>
                            <button onclick="playAudio('${safeAudioUrl}', '${wordForJs}')" class="focus:outline-none">
                                <i class="fas fa-volume-up speaker-icon text-xl"></i>
                            </button>
                        </div>

                        <!-- Sub-header -->
                        <div class="flex flex-wrap items-baseline gap-2 mb-3">
                            <span class="text-lg text-gray-600 font-serif italic">${safePhonetic}</span>
                            <span class="text-sm font-semibold bg-gray-200 text-gray-700 px-2 py-0.5 rounded">${safePos}</span>
                        </div>

                        <!-- Meanings -->
                        <div class="mb-4 space-y-1">
                            <p class="text-gray-800"><span class="font-bold text-blue-900">Eng:</span> ${safeEnglishMeaning}</p>
                            ${item.vietnameseMeaning ? `<p class="text-gray-800"><span class="font-bold text-red-900">Vie:</span> ${safeVietnameseMeaning}</p>` : ''}
                        </div>

                        <!-- Extra Details Grid -->
                        <div class="mb-4 bg-gray-50 p-2 rounded-md ${(!item.synonyms && !item.antonyms && !item.collocations) ? 'hidden' : ''}">
                            ${synonymsHtml}
                            ${antonymsHtml}
                            ${collocationsHtml}
                        </div>

                        <!-- Example -->
                        ${item.example ? `
                        <div class="text-gray-700 italic border-l-4 border-blue-200 pl-3">
                            "${safeExample}"
                            <button onclick="playAudio(null, '${exampleForJs}')" class="ml-2 text-gray-400 hover:text-gray-600">
                                <i class="fas fa-volume-up text-sm"></i>
                            </button>
                        </div>` : ''}
                    `;
                    vocabularyList.appendChild(card);
                });
            };

            const updateViewTabs = () => {
                const favoriteTotal = words.filter(item => item.favorite).length;
                favoritesCount.textContent = String(favoriteTotal);

                if (currentView === 'favorites') {
                    favoritesTab.className = 'px-4 py-2 rounded-lg text-sm font-semibold bg-yellow-400 text-gray-900';
                    allWordsTab.className = 'px-4 py-2 rounded-lg text-sm font-semibold bg-gray-200 text-gray-700';
                    recencyTab.className = 'px-4 py-2 rounded-lg text-sm font-semibold bg-gray-200 text-gray-700';
                } else if (currentView === 'recency') {
                    recencyTab.className = 'px-4 py-2 rounded-lg text-sm font-semibold bg-purple-600 text-white';
                    allWordsTab.className = 'px-4 py-2 rounded-lg text-sm font-semibold bg-gray-200 text-gray-700';
                    favoritesTab.className = 'px-4 py-2 rounded-lg text-sm font-semibold bg-gray-200 text-gray-700';
                } else {
                    allWordsTab.className = 'px-4 py-2 rounded-lg text-sm font-semibold bg-blue-600 text-white';
                    favoritesTab.className = 'px-4 py-2 rounded-lg text-sm font-semibold bg-gray-200 text-gray-700';
                    recencyTab.className = 'px-4 py-2 rounded-lg text-sm font-semibold bg-gray-200 text-gray-700';
                }
            };

            const applyFilters = () => {
                const term = searchInput.value.toLowerCase().trim();
                const recentWords = [...words]
                    .sort((a, b) => {
                        const aTime = Date.parse(safeReadString(a.createdAt)) || 0;
                        const bTime = Date.parse(safeReadString(b.createdAt)) || 0;
                        return bTime - aTime;
                    })
                    .slice(0, 10);
                const sourceWords = currentView === 'recency' ? recentWords : words;

                const filtered = sourceWords.filter(w => {
                    const matchesSearch =
                        safeReadString(w.word).toLowerCase().includes(term) ||
                        safeReadString(w.vietnameseMeaning).toLowerCase().includes(term) ||
                        safeReadString(w.englishMeaning).toLowerCase().includes(term);
                    const matchesView = currentView === 'favorites' ? Boolean(w.favorite) : true;
                    return matchesSearch && matchesView;
                });
                updateViewTabs();
                renderWords(filtered);
            };

            // --- CRUD Operations ---

            // 1. OPEN MODAL (ADD)
            const openAddModal = (prefillWord = '') => {
                wordForm.reset();
                document.getElementById('wordId').value = '';
                document.getElementById('audioUrl').value = '';
                document.getElementById('wordInput').value = safeReadString(prefillWord).trim();
                modalTitle.textContent = "Add a New Word";
                fetchStatus.textContent = '';
                modal.classList.remove('hidden');
            };

            addWordBtn.addEventListener('click', () => {
                openAddModal();
            });

            window.suggestAddWord = (word) => {
                openAddModal(word);
            };

            const saveTranslationToVocabulary = () => {
                if (!latestTranslationData.englishText) {
                    viTranslateStatus.innerHTML = '<span class="text-amber-600"><i class="fas fa-info-circle"></i> Translate first, then save.</span>';
                    return;
                }

                const candidateWord = latestTranslationData.englishWord || latestTranslationData.englishText.split(/\s+/)[0];
                const duplicate = words.some(w => safeReadString(w.word).toLowerCase() === safeReadString(candidateWord).toLowerCase());
                if (duplicate) {
                    viTranslateStatus.innerHTML = '<span class="text-amber-600"><i class="fas fa-info-circle"></i> This translated word already exists in your dictionary.</span>';
                    return;
                }

                openAddModal(candidateWord);
                document.getElementById('englishMeaning').value = safeReadString(viDefMeaning.textContent).trim() === '-' ? latestTranslationData.englishText : safeReadString(viDefMeaning.textContent);
                document.getElementById('vietnameseMeaning').value = latestTranslationData.vietnameseText || '';
                document.getElementById('exampleSentence').value = safeReadString(viDefExample.textContent).trim() === '-' ? '' : safeReadString(viDefExample.textContent);
                document.getElementById('partOfSpeech').value = safeReadString(viDefPos.textContent).trim() === '-' ? '' : safeReadString(viDefPos.textContent);
                document.getElementById('phonetics').value = safeReadString(viDefPhonetic.textContent).trim() === '-' ? '' : safeReadString(viDefPhonetic.textContent);
            };

            // 2. OPEN MODAL (EDIT) - Global function to be called from HTML
            window.openEditModal = (id) => {
                const wordToEdit = words.find(w => w.id === id);
                if (!wordToEdit) return;

                document.getElementById('wordId').value = wordToEdit.id;
                document.getElementById('wordInput').value = wordToEdit.word;
                document.getElementById('phonetics').value = wordToEdit.phonetic || '';
                document.getElementById('partOfSpeech').value = wordToEdit.partOfSpeech || '';
                document.getElementById('englishMeaning').value = wordToEdit.englishMeaning || '';
                document.getElementById('vietnameseMeaning').value = wordToEdit.vietnameseMeaning || '';
                document.getElementById('synonyms').value = wordToEdit.synonyms || '';
                document.getElementById('antonyms').value = wordToEdit.antonyms || '';
                document.getElementById('collocations').value = wordToEdit.collocations || '';
                document.getElementById('exampleSentence').value = wordToEdit.example || '';
                document.getElementById('audioUrl').value = wordToEdit.audioUrl || '';

                modalTitle.textContent = "Edit Word";
                fetchStatus.textContent = '';
                modal.classList.remove('hidden');
            };

            // 3. DELETE
            window.deleteWord = async (id) => {
                if (confirm('Are you sure you want to delete this word?')) {
                    if (!supabaseClient) return;
                    const { error } = await supabaseClient
                        .from(SUPABASE_TABLE)
                        .delete()
                        .eq('id', id);
                    if (error) {
                        console.error(error);
                        setDatabaseStatus(`Delete failed: ${error.message}`, 'error');
                        return;
                    }
                    await loadData();
                }
            };

            window.toggleFavorite = async (id) => {
                const index = words.findIndex(w => w.id === id);
                if (index === -1) return;
                const nextFavorite = !words[index].favorite;
                if (!supabaseClient) return;
                const { error } = await supabaseClient
                    .from(SUPABASE_TABLE)
                    .update({
                        favorite: nextFavorite,
                        updated_at: new Date().toISOString()
                    })
                    .eq('id', id);
                if (error) {
                    console.error(error);
                    setDatabaseStatus(`Favorite update failed: ${error.message}`, 'error');
                    return;
                }
                words[index].favorite = nextFavorite;
                words[index].updatedAt = new Date().toISOString();
                applyFilters();
            };

            // 4. SAVE (CREATE or UPDATE)
            wordForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!supabaseClient) return;
                
                const id = document.getElementById('wordId').value;
                const newWordData = {
                    word: document.getElementById('wordInput').value.trim(),
                    phonetic: document.getElementById('phonetics').value.trim(),
                    partOfSpeech: document.getElementById('partOfSpeech').value.trim(),
                    englishMeaning: document.getElementById('englishMeaning').value.trim(),
                    vietnameseMeaning: document.getElementById('vietnameseMeaning').value.trim(),
                    synonyms: document.getElementById('synonyms').value.trim(),
                    antonyms: document.getElementById('antonyms').value.trim(),
                    collocations: document.getElementById('collocations').value.trim(),
                    example: document.getElementById('exampleSentence').value.trim(),
                    audioUrl: document.getElementById('audioUrl').value,
                    favorite: false
                };

                if (id) {
                    const index = words.findIndex(w => w.id === id);
                    if (index !== -1) {
                        newWordData.favorite = Boolean(words[index].favorite);
                    }
                } else {
                    const isDuplicate = words.some(w => safeReadString(w.word).toLowerCase() === newWordData.word.toLowerCase());
                    if (isDuplicate) {
                        fetchStatus.innerHTML = '<span class="text-red-500"><i class="fas fa-exclamation-circle"></i> This word already exists in your dictionary.</span>';
                        document.getElementById('wordInput').focus();
                        return;
                    }
                }

                const payload = appWordToDbPayload(newWordData);

                if (id) {
                    const { error } = await supabaseClient
                        .from(SUPABASE_TABLE)
                        .update(payload)
                        .eq('id', id);
                    if (error) {
                        console.error(error);
                        setDatabaseStatus(`Update failed: ${error.message}`, 'error');
                        return;
                    }
                } else {
                    const { error } = await supabaseClient
                        .from(SUPABASE_TABLE)
                        .insert({
                            ...payload,
                            created_at: new Date().toISOString()
                        });
                    if (error) {
                        console.error(error);
                        setDatabaseStatus(`Create failed: ${error.message}`, 'error');
                        return;
                    }
                }

                await loadData();
                closeModal();
            });


            // --- Fetching from API ---
            fetchWordDataBtn.addEventListener('click', async () => {
                const word = document.getElementById('wordInput').value.trim();
                if (!word) {
                    fetchStatus.textContent = "Please enter a word first.";
                    return;
                }

                fetchStatus.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Fetching dictionary + synonyms + antonyms + collocations + Vietnamese...';
                
                try {
                    const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
                    if (!response.ok) throw new Error('Not found');
                    
                    const data = await response.json();
                    const entry = data[0];
                    const meanings = Array.isArray(entry.meanings) ? entry.meanings : [];
                    const primaryMeaning = meanings.find(m => Array.isArray(m.definitions) && m.definitions.length) || meanings[0] || {};
                    const primaryDefinition = Array.isArray(primaryMeaning.definitions) ? primaryMeaning.definitions[0] : null;

                    const phonetics = Array.isArray(entry.phonetics) ? entry.phonetics : [];
                    const validPhonetic = phonetics.find(p => p.audio && p.text) || phonetics.find(p => p.audio) || phonetics.find(p => p.text) || {};

                    const partOfSpeech = safeReadString(primaryMeaning.partOfSpeech) || 'noun';
                    const englishMeaning = safeReadString(primaryDefinition?.definition);

                    const apiSynonyms = uniqueNormalizedList([
                        ...(primaryMeaning.synonyms || []),
                        ...(primaryDefinition?.synonyms || [])
                    ], 10);
                    const apiAntonyms = uniqueNormalizedList([
                        ...(primaryMeaning.antonyms || []),
                        ...(primaryDefinition?.antonyms || [])
                    ], 10);

                    const dictionaryExamples = uniqueNormalizedList(
                        meanings.flatMap(m => (m.definitions || []).map(d => d.example)),
                        5
                    );
                    const exampleSentence = dictionaryExamples[0] || buildFallbackExample(word, partOfSpeech);

                    const [
                        datamuseSynonymsResult,
                        datamuseAntonymsResult,
                        previousCollocationsResult,
                        nextCollocationsResult,
                        vietnameseResult
                    ] = await Promise.allSettled([
                        fetchDatamuseWords(`rel_syn=${encodeURIComponent(word)}&max=10`),
                        fetchDatamuseWords(`rel_ant=${encodeURIComponent(word)}&max=10`),
                        fetchDatamuseWords(`rel_bgb=${encodeURIComponent(word)}&max=6`),
                        fetchDatamuseWords(`rel_bga=${encodeURIComponent(word)}&max=6`),
                        fetchVietnameseMeaning(englishMeaning || word)
                    ]);

                    const datamuseSynonyms = datamuseSynonymsResult.status === 'fulfilled' ? datamuseSynonymsResult.value : [];
                    const datamuseAntonyms = datamuseAntonymsResult.status === 'fulfilled' ? datamuseAntonymsResult.value : [];
                    const previousCollocations = previousCollocationsResult.status === 'fulfilled' ? previousCollocationsResult.value : [];
                    const nextCollocations = nextCollocationsResult.status === 'fulfilled' ? nextCollocationsResult.value : [];
                    const vietnameseMeaning = vietnameseResult.status === 'fulfilled' ? vietnameseResult.value : '';

                    const mergedSynonyms = uniqueNormalizedList([...apiSynonyms, ...datamuseSynonyms], 8);
                    const mergedAntonyms = uniqueNormalizedList([...apiAntonyms, ...datamuseAntonyms], 8);
                    const mergedCollocations = uniqueNormalizedList([
                        ...previousCollocations.map(item => `${item} ${word}`),
                        ...nextCollocations.map(item => `${word} ${item}`)
                    ], 8);

                    document.getElementById('phonetics').value = safeReadString(validPhonetic.text);
                    document.getElementById('audioUrl').value = safeReadString(validPhonetic.audio);
                    document.getElementById('partOfSpeech').value = partOfSpeech;
                    document.getElementById('englishMeaning').value = englishMeaning;
                    document.getElementById('vietnameseMeaning').value = vietnameseMeaning;
                    document.getElementById('synonyms').value = mergedSynonyms.join(', ');
                    document.getElementById('antonyms').value = mergedAntonyms.join(', ');
                    document.getElementById('collocations').value = mergedCollocations.join(', ');
                    document.getElementById('exampleSentence').value = exampleSentence;

                    const missingFields = [];
                    if (!document.getElementById('vietnameseMeaning').value.trim()) missingFields.push('Vietnamese');
                    if (!document.getElementById('synonyms').value.trim()) missingFields.push('synonyms');
                    if (!document.getElementById('antonyms').value.trim()) missingFields.push('antonyms');
                    if (!document.getElementById('collocations').value.trim()) missingFields.push('collocations');
                    if (!document.getElementById('exampleSentence').value.trim()) missingFields.push('example');

                    if (missingFields.length) {
                        fetchStatus.innerHTML = `<span class="text-amber-600"><i class="fas fa-info-circle"></i> Partial result. Missing: ${missingFields.join(', ')}.</span>`;
                    } else {
                        fetchStatus.innerHTML = '<span class="text-green-600"><i class="fas fa-check"></i> Great! All main fields were auto-filled.</span>';
                    }
                } catch (err) {
                    console.error(err);
                    fetchStatus.innerHTML = '<span class="text-red-500"><i class="fas fa-exclamation-circle"></i> Word not found on online dictionary.</span>';
                }
            });


            // --- UI Handlers ---
            const closeModal = () => {
                modal.classList.add('hidden');
            };

            closeModalBtn.addEventListener('click', closeModal);
            cancelBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });

            // Search
            searchInput.addEventListener('input', (e) => {
                applyFilters();
            });

            allWordsTab.addEventListener('click', () => {
                currentView = 'all';
                applyFilters();
            });

            favoritesTab.addEventListener('click', () => {
                currentView = 'favorites';
                applyFilters();
            });

            recencyTab.addEventListener('click', () => {
                currentView = 'recency';
                applyFilters();
            });

            refreshDbBtn.addEventListener('click', async () => {
                await loadData();
            });

            viTranslateBtn.addEventListener('click', translateTextByDirection);
            viInput.addEventListener('keydown', (event) => {
                if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
                    translateTextByDirection();
                }
            });
            viTabTranslation.addEventListener('click', () => setViTab('translation'));
            viTabDefinition.addEventListener('click', () => setViTab('definition'));
            viEnDirection.addEventListener('change', () => {
                updateTranslatorDirectionUI();
                saveTranslatorSettings();
            });
            viEnSpeakBtn.addEventListener('click', () => {
                if (!latestTranslation) return;
                const lang = viEnDirection.value === 'vi-en' ? 'en-US' : 'vi-VN';
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(latestTranslation);
                    utterance.lang = lang;
                    window.speechSynthesis.speak(utterance);
                }
            });
            saveFromTranslateBtn.addEventListener('click', saveTranslationToVocabulary);
            aiRewriteBtn.addEventListener('click', async () => {
                saveTranslatorSettings();
                await rewriteWithAI();
            });

            const applyInitialViewFromUrl = () => {
                const view = new URLSearchParams(window.location.search).get('view');
                if (view === 'favorites' || view === 'recency' || view === 'all') {
                    currentView = view;
                }
            };

            const applyInitialToolFromUrl = () => {
                const tool = new URLSearchParams(window.location.search).get('tool');
                if (tool !== 'translator') return;

                // Run after first paint so Safari extension iframe can settle layout before scrolling.
                requestAnimationFrame(() => {
                    translatorSection?.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    viInput?.focus();
                });
            };

            // Initialize
            setViTab('translation');
            loadTranslatorSettings();
            updateTranslatorDirectionUI();
            applyInitialViewFromUrl();
            applyInitialToolFromUrl();
            loadData();
        });
    </script>
</body>
</html>
