<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>H2M Vocabulary</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="card">
    <header class="header">
      <div class="logo logo-placeholder">H2M</div>
      <div>
        <h1>H2M Vocabulary</h1>
        <p>Safari quick access</p>
      </div>
    </header>

    <button id="openAppBtn" class="btn btn-primary">Open App</button>
    <button id="openFavoritesBtn" class="btn">Open Favorites Tab</button>
    <button id="openRecencyBtn" class="btn">Open Recency Tab</button>

    <label class="label" for="customUrlInput">Custom app URL (optional)</label>
    <input id="customUrlInput" class="input" type="url" placeholder="https://h2mvocab.vercel.app" />
    <button id="saveUrlBtn" class="btn">Save URL</button>
    <p id="statusText" class="status"></p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
